<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: English Rules for A1</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f4f7f6; 
            margin: 0; 
            padding: 20px;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        h1 { color: #2c3e50; font-size: 2.5em; margin-bottom: 5px; }
        .subtitle { color: #7f8c8d; font-size: 1.2em; margin-top: 0; }
        
        .quiz-container {
            width: 100%;
            max-width: 800px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
        }
        
        .question-block {
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #ecf0f1;
        }
        .question-block:last-child {
            border-bottom: none;
        }
        
        .question-text {
            font-size: 1.4em;
            color: #34495e;
            font-weight: bold;
            margin-bottom: 15px;
        }
        
        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        button {
            padding: 12px 20px;
            font-size: 1.1em;
            text-align: left;
            background-color: #f8f9fa;
            border: 2px solid #bdc3c7;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        button:hover {
            background-color: #e2e6ea;
        }
        
        button:disabled {
            cursor: not-allowed;
            opacity: 0.8;
        }

        .correct-btn { background-color: #d4edda !important; border-color: #28a745 !important; color: #155724 !important; }
        .wrong-btn { background-color: #f8d7da !important; border-color: #dc3545 !important; color: #721c24 !important; }

        .explanation {
            display: none;
            margin-top: 15px;
            padding: 15px;
            border-radius: 8px;
            background-color: #e8f4f8;
            border-left: 5px solid #3498db;
            font-size: 1.1em;
            color: #2c3e50;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>English Grammar Quiz</h1>
        <p class="subtitle">Capital Letters & Prepositions (In / At / To / For)</p>
    </div>

    <div class="quiz-container">

        <!-- Question 1 -->
        <div class="question-block">
            <div class="question-text">1. I really like ________.</div>

                <button onclick="checkAnswer(this, 'q1', true)">B) geography
